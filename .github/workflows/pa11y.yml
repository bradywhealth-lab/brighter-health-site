name: pa11y Accessibility Checks

on:
  pull_request:
    paths:
      - '**/*.html'

jobs:
  pa11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install http-server and pa11y
        run: |
          npm install -g http-server pa11y

      - name: Start static server
        run: |
          npx http-server -p 8080 &
          sleep 2

      - name: Run pa11y on index.html and upload results
        run: |
          npx pa11y http://127.0.0.1:8080/index.html --reporter json > pa11y-index.json || true
          ls -lah pa11y-index.json || true

      - name: Run pa11y on landing.html and upload results
        run: |
          npx pa11y http://127.0.0.1:8080/landing.html --reporter json > pa11y-landing.json || true
          ls -lah pa11y-landing.json || true

      - name: Upload pa11y results
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-reports
          path: |
            pa11y-index.json
            pa11y-landing.json
