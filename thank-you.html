<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks for reaching out | Brighter Health Solutions</title>
  <style>
    :root {
      --primary: #0f9d92;
      --primary-dark: #0b746b;
      --bg: #f5f7fb;
      --text: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #e0f7f4, #f5f7fb 55%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 1.8rem 1.6rem;
      max-width: 560px;
      width: 100%;
      box-shadow: 0 24px 65px rgba(15, 157, 146, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.35);
      text-align: center;
    }

    h1 {
      font-size: clamp(1.8rem, 2vw + 1rem, 2.35rem);
      margin-bottom: 0.75rem;
      color: var(--primary-dark);
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #334155;
    }

    .actions {
      margin-top: 1.4rem;
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      padding: 0.75rem 1.2rem;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      color: #ffffff;
      background: var(--primary);
      box-shadow: 0 16px 32px rgba(15, 157, 146, 0.25);
    }

    a.btn:hover {
      background: var(--primary-dark);
    }

    .sub {
      margin-top: 0.4rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thanks for reaching out!</h1>
    <p>Your request was received. Expect a reply from Brady within one business day with next steps and options tailored to you.</p>
    <div class="sub">If you want to talk sooner, call or text (239) 310-8926 or (970) 306-5173.</div>
    <div class="actions">
      <a class="btn" href="index.html">Back to home</a>
      <a class="btn" href="landing.html" style="background: #0b746b;">Explore alternatives</a>
    </div>
  </div>
</body>
</html>
