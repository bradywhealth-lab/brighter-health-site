<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Brighter Health Solutions</title>
  <style>
    :root {
      --primary: #0f9d92;
      --primary-dark: #0b746b;
      --bg: #f5f7fb;
      --text: #1f2933;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 20%, #e0f7f4, #f5f7fb 55%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 1.5rem;
      text-align: center;
      line-height: 1.6;
    }
    .card {
      background: #ffffff;
      padding: 1.75rem 1.6rem;
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(15, 157, 146, 0.18);
      max-width: 520px;
      width: 100%;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    h1 { font-size: 1.7rem; margin-bottom: 0.6rem; }
    p { color: var(--muted); margin-bottom: 1rem; }
    a {
      display: inline-block;
      margin-top: 0.2rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #0f9d92, #0b746b);
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(15, 157, 146, 0.35);
    }
    a:hover { filter: brightness(0.96); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you!</h1>
    <p>Your request was received. Brady will review your details and reach out with tailored health coverage options soon.</p>
    <a href="/landing.html">Back to the landing page</a>
  </div>
</body>
</html>
